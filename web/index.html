<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DECIDE v2.0 - Evaluador de Inteligencia Emocional</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef6ff',
              100: '#d9ecff',
              200: '#bcdfff',
              300: '#8ecaff',
              400: '#58abff',
              500: '#3188fc',
              600: '#1b69f1',
              700: '#1452de',
              800: '#1743b3',
              900: '#193c8d',
            }
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(12px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            popIn: {
              '0%': { opacity: '0', transform: 'scale(0.92)' },
              '70%': { transform: 'scale(1.03)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            glowPulse: {
              '0%, 100%': { opacity: '0.4' },
              '50%': { opacity: '0.8' },
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'pop-in': 'popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
            'glow-pulse': 'glowPulse 3s infinite',
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #070a12;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(18, 28, 51, 0.55);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover {
      background: rgba(28, 42, 74, 0.75);
      border-color: rgba(49, 136, 252, 0.4);
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="selection:bg-brand-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Componente ScoreGauge animado
    function ScoreGauge({ percentage = 0, size = 180, strokeWidth = 14 }) {
      const radius = (size - strokeWidth) / 2;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (percentage / 100) * circumference;

      let strokeColor = '#3188fc';
      let badgeText = 'Adecuado';
      let badgeBg = 'bg-blue-500/10 text-blue-400 border-blue-500/30';

      if (percentage <= 20) {
        strokeColor = '#ef4444';
        badgeText = 'Necesita Fortalecimiento';
        badgeBg = 'bg-rose-500/10 text-rose-400 border-rose-500/30';
      } else if (percentage <= 40) {
        strokeColor = '#f97316';
        badgeText = 'En Desarrollo';
        badgeBg = 'bg-orange-500/10 text-orange-400 border-orange-500/30';
      } else if (percentage <= 60) {
        strokeColor = '#eab308';
        badgeText = 'Nivel Adecuado';
        badgeBg = 'bg-amber-500/10 text-amber-400 border-amber-500/30';
      } else if (percentage <= 80) {
        strokeColor = '#10b981';
        badgeText = 'Nivel Alto';
        badgeBg = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
      } else {
        strokeColor = '#6366f1';
        badgeText = 'Nivel Sobresaliente';
        badgeBg = 'bg-indigo-500/10 text-indigo-400 border-indigo-500/30';
      }

      return (
        <div className="flex flex-col items-center justify-center">
          <div className="relative" style={{ width: size, height: size }}>
            <svg className="w-full h-full transform -rotate-90" viewBox={`0 0 ${size} ${size}`}>
              <circle
                cx={size / 2}
                cy={size / 2}
                r={radius}
                stroke="currentColor"
                strokeWidth={strokeWidth}
                className="text-slate-800"
                fill="transparent"
              />
              <circle
                cx={size / 2}
                cy={size / 2}
                r={radius}
                stroke={strokeColor}
                strokeWidth={strokeWidth}
                strokeDasharray={circumference}
                strokeDashoffset={offset}
                strokeLinecap="round"
                fill="transparent"
                style={{ transition: 'stroke-dashoffset 1s ease-out' }}
              />
            </svg>
            <div className="absolute inset-0 flex flex-col items-center justify-center">
              <span className="text-4xl font-black text-white tracking-tight">{percentage}%</span>
              <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Puntuación</span>
            </div>
          </div>
          <div className={`mt-3 px-3 py-1 rounded-full text-xs font-bold border ${badgeBg}`}>
            {badgeText}
          </div>
        </div>
      );
    }

    // Modal de Logros con Confetti
    function AchievementModal({ logros, onClose }) {
      useEffect(() => {
        if (window.confetti) {
          window.confetti({
            particleCount: 110,
            spread: 80,
            origin: { y: 0.6 },
            colors: ['#3188fc', '#2ecc71', '#f59e0b', '#ec4899', '#8b5cf6']
          });
        }
      }, [logros]);

      if (!logros || logros.length === 0) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md animate-fade-in">
          <div className="relative w-full max-w-md bg-gradient-to-b from-slate-900 to-slate-950 border border-amber-500/40 rounded-3xl p-6 sm:p-8 shadow-2xl shadow-amber-500/10 animate-pop-in text-center">
            <div className="mx-auto w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center text-3xl mb-4 shadow-xl shadow-amber-500/30 animate-bounce">
              🏆
            </div>
            <div className="inline-flex items-center space-x-1.5 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-bold mb-2">
              <span>¡NUEVO LOGRO DESBLOQUEADO!</span>
            </div>
            <h3 className="text-2xl font-black text-white mb-2">
              {logros.length === 1 ? '¡Felicitaciones!' : `¡Desbloqueaste ${logros.length} Logros!`}
            </h3>
            <p className="text-xs text-slate-400 mb-5">
              Tu crecimiento en competencias emocionales sigue dando frutos.
            </p>
            <div className="space-y-3 mb-6 text-left max-h-56 overflow-y-auto pr-1">
              {logros.map((l, i) => (
                <div key={i} className="flex items-center space-x-3.5 p-3.5 rounded-2xl bg-slate-800/80 border border-slate-700/80">
                  <div className="text-2xl">{l.icono || '🏆'}</div>
                  <div className="flex-1 min-w-0">
                    <h4 className="text-xs font-bold text-white truncate">{l.nombre}</h4>
                    <p className="text-[11px] text-slate-400 line-clamp-2">{l.descripcion}</p>
                  </div>
                  <span className="text-emerald-400 font-bold text-sm">✓</span>
                </div>
              ))}
            </div>
            <button
              onClick={onClose}
              className="w-full py-3 px-5 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-bold text-sm shadow-lg shadow-brand-500/25 transition-all"
            >
              ¡Continuar!
            </button>
          </div>
        </div>
      );
    }

    // App Principal
    function App() {
      const [usuario, setUsuario] = useState(() => {
        const guardado = localStorage.getItem('decide_usuario');
        return guardado ? JSON.parse(guardado) : null;
      });
      const [vista, setVista] = useState(() => (usuario ? 'dashboard' : 'login'));
      const [situaciones, setSituaciones] = useState([]);
      const [resultadoData, setResultadoData] = useState(null);
      const [nuevosLogros, setNuevosLogros] = useState([]);
      const [nombreInput, setNombreInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [loginCargando, setLoginCargando] = useState(false);

      // Cargar situaciones
      useEffect(() => {
        fetch('/api/situaciones')
          .then(r => r.json())
          .then(data => setSituaciones(data))
          .catch(e => console.error(e));
      }, []);

      // Persistir usuario
      useEffect(() => {
        if (usuario) {
          localStorage.setItem('decide_usuario', JSON.stringify(usuario));
        } else {
          localStorage.removeItem('decide_usuario');
        }
      }, [usuario]);

      const handleLogin = async (e) => {
        e.preventDefault();
        if (!nombreInput.trim()) {
          setLoginError('Por favor ingresa tu nombre');
          return;
        }
        setLoginError('');
        setLoginCargando(true);
        try {
          const res = await fetch('/api/usuario/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre: nombreInput.trim() })
          });
          const user = await res.json();
          setUsuario(user);
          setVista('dashboard');
        } catch (err) {
          setLoginError('No se pudo conectar con el servidor.');
        } finally {
          setLoginCargando(false);
        }
      };

      const handleCerrarSesion = () => {
        setUsuario(null);
        setVista('login');
        setResultadoData(null);
      };

      // Estado para la evaluación en curso
      const [indiceActual, setIndiceActual] = useState(0);
      const [respuestas, setRespuestas] = useState([]);
      const [opcionSeleccionada, setOpcionSeleccionada] = useState(null);
      const [evaluando, setEvaluando] = useState(false);
      const [alertaEvaluacion, setAlertaEvaluacion] = useState('');

      const situacionActual = situaciones[indiceActual];

      // Preseleccionar si retrocedió
      useEffect(() => {
        if (!situacionActual) return;
        const previa = respuestas.find(r => r.situacion_id === situacionActual.id);
        setOpcionSeleccionada(previa ? previa.opcion_indice : null);
      }, [indiceActual, situacionActual]);

      const handleSiguienteSituacion = async () => {
        if (opcionSeleccionada === null) {
          setAlertaEvaluacion('Selecciona una opción para continuar.');
          return;
        }
        setAlertaEvaluacion('');

        const nuevas = [...respuestas];
        const existIdx = nuevas.findIndex(r => r.situacion_id === situacionActual.id);
        if (existIdx >= 0) {
          nuevas[existIdx] = { situacion_id: situacionActual.id, opcion_indice: opcionSeleccionada };
        } else {
          nuevas.push({ situacion_id: situacionActual.id, opcion_indice: opcionSeleccionada });
        }
        setRespuestas(nuevas);

        if (indiceActual === situaciones.length - 1) {
          // Finalizar
          setEvaluando(true);
          try {
            const res = await fetch('/api/evaluacion/enviar', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ usuario_id: usuario.id, respuestas: nuevas })
            });
            const data = await res.json();
            setResultadoData(data);
            if (data.gamificacion) {
              setUsuario(prev => ({
                ...prev,
                puntos: data.gamificacion.puntos,
                nivel: data.gamificacion.nivel,
                info_nivel: data.gamificacion.info_nivel,
                progreso_nivel: {
                  progreso: data.gamificacion.progreso,
                  siguiente_nivel: data.gamificacion.siguiente_nivel,
                  icono_siguiente: data.gamificacion.icono_siguiente
                }
              }));
            }
            if (data.nuevos_logros && data.nuevos_logros.length > 0) {
              setNuevosLogros(data.nuevos_logros);
            }
            setVista('resultados');
          } catch (e) {
            setAlertaEvaluacion('Error al procesar la evaluación.');
          } finally {
            setEvaluando(false);
          }
        } else {
          setIndiceActual(prev => prev + 1);
        }
      };

      const handleAtrasSituacion = () => {
        if (indiceActual > 0) {
          setIndiceActual(prev => prev - 1);
        }
      };

      const iniciarTest = () => {
        setIndiceActual(0);
        setRespuestas([]);
        setOpcionSeleccionada(null);
        setAlertaEvaluacion('');
        setVista('evaluacion');
      };

      // Cargar historial
      const [historial, setHistorial] = useState([]);
      const [cargandoHistorial, setCargandoHistorial] = useState(false);
      useEffect(() => {
        if (vista === 'historial' && usuario?.id) {
          setCargandoHistorial(true);
          fetch(`/api/usuario/${usuario.id}/historial`)
            .then(r => r.json())
            .then(d => { setHistorial(d); setCargandoHistorial(false); })
            .catch(() => setCargandoHistorial(false));
        }
      }, [vista, usuario]);

      // Cargar logros
      const [datosLogros, setDatosLogros] = useState(null);
      const [cargandoLogros, setCargandoLogros] = useState(false);
      useEffect(() => {
        if (vista === 'logros' && usuario?.id) {
          setCargandoLogros(true);
          fetch(`/api/usuario/${usuario.id}/logros`)
            .then(r => r.json())
            .then(d => { setDatosLogros(d); setCargandoLogros(false); })
            .catch(() => setCargandoLogros(false));
        }
      }, [vista, usuario]);

      const progresoNivel = usuario?.progreso_nivel || { progreso: 0, siguiente_nivel: 'Principiante', icono_siguiente: '🌱' };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header / Navbar */}
          {usuario && (
            <header className="sticky top-0 z-40 w-full glass-panel border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-xl">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div onClick={() => setVista('dashboard')} className="flex items-center space-x-3 cursor-pointer group">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 via-indigo-600 to-cyan-400 p-0.5 shadow-lg shadow-brand-500/20 group-hover:scale-105 transition-transform flex items-center justify-center">
                    <span className="text-xl">🧠</span>
                  </div>
                  <div>
                    <div className="flex items-center space-x-1.5">
                      <span className="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                        DECIDE
                      </span>
                      <span className="text-[10px] font-bold px-1.5 py-0.5 rounded bg-brand-500/20 text-brand-400 border border-brand-500/30">
                        v2.0 Web
                      </span>
                    </div>
                  </div>
                </div>

                <nav className="hidden md:flex items-center space-x-1 bg-slate-900/60 p-1 rounded-xl border border-slate-800">
                  {[
                    { id: 'dashboard', label: 'Inicio', icon: '🏠' },
                    { id: 'evaluacion', label: 'Test Situacional', icon: '✨' },
                    { id: 'historial', label: 'Historial', icon: '📜' },
                    { id: 'logros', label: 'Logros', icon: '🏆' },
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => {
                        if (tab.id === 'evaluacion') iniciarTest();
                        else setVista(tab.id);
                      }}
                      className={`flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-all ${
                        vista === tab.id
                          ? 'bg-gradient-to-r from-brand-600 to-indigo-600 text-white shadow-md shadow-brand-500/20'
                          : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                      }`}
                    >
                      <span>{tab.icon}</span>
                      <span>{tab.label}</span>
                    </button>
                  ))}
                </nav>

                <div className="flex items-center space-x-3">
                  <div className="hidden sm:flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-slate-900/80 border border-slate-800 text-xs">
                    <span>{usuario.info_nivel?.icono || '🌱'}</span>
                    <span className="font-bold text-white">{usuario.nombre}</span>
                    <span className="text-amber-400 font-extrabold">🎯 {usuario.puntos} pts</span>
                  </div>
                  <button
                    onClick={handleCerrarSesion}
                    className="py-1.5 px-3 rounded-xl border border-slate-800 text-slate-400 hover:text-rose-400 hover:border-rose-500/40 text-xs font-semibold transition-all"
                  >
                    Salir
                  </button>
                </div>
              </div>
            </header>
          )}

          {/* Vistas */}
          <main className="flex-1 pb-12">
            
            {/* 1. LOGIN */}
            {(!usuario || vista === 'login') && (
              <div className="min-h-[calc(100vh-4rem)] flex items-center justify-center p-4">
                <div className="max-w-4xl w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                  <div className="lg:col-span-7 space-y-6 text-center lg:text-left">
                    <div className="inline-flex items-center space-x-2 px-3 py-1.5 rounded-full bg-brand-500/10 border border-brand-500/30 text-brand-400 text-xs font-semibold">
                      <span>✨ DECIDE 2.0 Web Edition</span>
                    </div>
                    <h1 className="text-4xl sm:text-5xl font-black tracking-tight leading-tight text-white">
                      Diagnostica y potencia tu{' '}
                      <span className="bg-gradient-to-r from-brand-400 via-indigo-400 to-cyan-300 bg-clip-text text-transparent">
                        Inteligencia Emocional
                      </span>
                    </h1>
                    <p className="text-slate-400 text-sm sm:text-base max-w-xl">
                      Evalúa tus competencias ante situaciones reales con modelos normativos, algoritmos de desarrollo y gamificación interactiva.
                    </p>
                    <div className="grid grid-cols-3 gap-3 pt-2">
                      <div className="glass-card p-3 rounded-2xl text-left">
                        <div className="text-xl mb-1">🧠</div>
                        <div className="text-xs font-bold text-white">9 Competencias</div>
                        <div className="text-[10px] text-slate-400">Diagnóstico integral</div>
                      </div>
                      <div className="glass-card p-3 rounded-2xl text-left">
                        <div className="text-xl mb-1">🛡️</div>
                        <div className="text-xs font-bold text-white">16 Escenarios</div>
                        <div className="text-[10px] text-slate-400">Casos reales</div>
                      </div>
                      <div className="glass-card p-3 rounded-2xl text-left">
                        <div className="text-xl mb-1">🏆</div>
                        <div className="text-xs font-bold text-white">Gamificación</div>
                        <div className="text-[10px] text-slate-400">12 logros desbloqueables</div>
                      </div>
                    </div>
                  </div>

                  <div className="lg:col-span-5 w-full max-w-md mx-auto">
                    <div className="glass-panel p-6 sm:p-8 rounded-3xl border border-slate-800 shadow-2xl">
                      <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-600 flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg shadow-brand-500/25">
                        🧠
                      </div>
                      <h2 className="text-xl font-bold text-white text-center mb-1">Bienvenido a DECIDE</h2>
                      <p className="text-xs text-slate-400 text-center mb-6">Ingresa tu nombre para acceder a tu perfil</p>
                      
                      {loginError && (
                        <div className="mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs">
                          {loginError}
                        </div>
                      )}

                      <form onSubmit={handleLogin} className="space-y-4">
                        <div>
                          <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                            Tu Nombre o Alias
                          </label>
                          <input
                            type="text"
                            value={nombreInput}
                            onChange={e => setNombreInput(e.target.value)}
                            placeholder="Ej. Fabian, Carlos..."
                            className="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 text-white text-sm outline-none transition-all"
                            autoFocus
                          />
                        </div>
                        <button
                          type="submit"
                          disabled={loginCargando}
                          className="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-brand-600 via-indigo-600 to-cyan-500 hover:from-brand-500 text-white font-bold text-sm shadow-xl shadow-brand-500/25 transition-all"
                        >
                          {loginCargando ? 'Iniciando...' : 'Comenzar Experiencia →'}
                        </button>
                      </form>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 2. DASHBOARD */}
            {usuario && vista === 'dashboard' && (
              <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8 animate-fade-in">
                <div className="glass-panel p-6 sm:p-8 rounded-3xl border border-brand-500/20 relative overflow-hidden">
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">
                    <div className="lg:col-span-7 space-y-3">
                      <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-brand-500/15 border border-brand-500/30 text-brand-300 text-xs font-semibold">
                        <span>{usuario.info_nivel?.icono || '🌱'} Rango Actual: {usuario.info_nivel?.nombre || 'Novato'}</span>
                      </div>
                      <h1 className="text-3xl sm:text-4xl font-black text-white tracking-tight">
                        ¡Hola, {usuario.nombre}! 👋
                      </h1>
                      <p className="text-sm text-slate-300 max-w-xl">
                        Bienvenido a tu panel DECIDE. Completa evaluaciones para medir tu inteligencia emocional, ganar puntos y alcanzar el rango de <strong>Maestro</strong>.
                      </p>
                      <div className="pt-2 max-w-md">
                        <div className="flex justify-between text-xs font-medium mb-1.5">
                          <span className="text-slate-400">Progreso a <strong>{progresoNivel.icono_siguiente} {progresoNivel.siguiente_nivel}</strong></span>
                          <span className="text-brand-400 font-bold">{progresoNivel.progreso}%</span>
                        </div>
                        <div className="w-full h-3 rounded-full bg-slate-800 overflow-hidden border border-slate-700">
                          <div 
                            className="h-full bg-gradient-to-r from-brand-500 via-indigo-500 to-cyan-400 transition-all duration-700"
                            style={{ width: `${progresoNivel.progreso}%` }}
                          />
                        </div>
                      </div>
                    </div>

                    <div className="lg:col-span-5 flex flex-col gap-3 justify-center">
                      <button
                        onClick={iniciarTest}
                        className="py-4 px-6 rounded-2xl bg-gradient-to-r from-brand-600 via-indigo-600 to-cyan-500 hover:from-brand-500 text-white font-extrabold text-base shadow-xl shadow-brand-500/25 flex items-center justify-center space-x-3 transition-all hover:scale-[1.02]"
                      >
                        <span>✨ Iniciar Nueva Evaluación</span>
                        <span>→</span>
                      </button>
                      <div className="grid grid-cols-2 gap-2 text-center text-xs">
                        <div className="p-3 rounded-xl bg-slate-900/60 border border-slate-800">
                          <span className="text-slate-400">Puntos</span>
                          <div className="text-lg font-black text-amber-400">🎯 {usuario.puntos}</div>
                        </div>
                        <div className="p-3 rounded-xl bg-slate-900/60 border border-slate-800">
                          <span className="text-slate-400">Rango</span>
                          <div className="text-lg font-black text-cyan-300">#{usuario.nivel} {usuario.info_nivel?.nombre}</div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Cards de navegación rápida */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                  <div onClick={iniciarTest} className="glass-card p-6 rounded-3xl cursor-pointer">
                    <div className="text-2xl mb-3">📝</div>
                    <h3 className="text-base font-bold text-white mb-1">Test Situacional</h3>
                    <p className="text-xs text-slate-400">Responde 16 situaciones cotidianas para calcular tu perfil.</p>
                  </div>
                  <div onClick={() => setVista('logros')} className="glass-card p-6 rounded-3xl cursor-pointer">
                    <div className="text-2xl mb-3">🏆</div>
                    <h3 className="text-base font-bold text-white mb-1">Mis Logros (12)</h3>
                    <p className="text-xs text-slate-400">Insignias desbloqueables por evaluaciones y competencias altas.</p>
                  </div>
                  <div onClick={() => setVista('historial')} className="glass-card p-6 rounded-3xl cursor-pointer">
                    <div className="text-2xl mb-3">📜</div>
                    <h3 className="text-base font-bold text-white mb-1">Historial de Evaluaciones</h3>
                    <p className="text-xs text-slate-400">Revisa la evolución de tus puntuaciones a lo largo del tiempo.</p>
                  </div>
                </div>
              </div>
            )}

            {/* 3. EVALUACIÓN INTERACTIVA */}
            {usuario && vista === 'evaluacion' && situacionActual && (
              <div className="max-w-3xl mx-auto px-4 sm:px-6 py-8 animate-fade-in">
                <div className="space-y-3 mb-6">
                  <div className="flex items-center justify-between text-xs font-semibold">
                    <span className="px-2.5 py-1 rounded-full border border-brand-500/30 bg-brand-500/10 text-brand-400 text-[11px] font-bold">
                      {situacionActual.categoria ? situacionActual.categoria.toUpperCase() : 'GENERAL'}
                    </span>
                    <span className="text-slate-400">
                      Situación {indiceActual + 1} de {situaciones.length}
                    </span>
                    <span className="text-brand-400 font-bold">
                      {Math.round(((indiceActual) / situaciones.length) * 100)}%
                    </span>
                  </div>
                  <div className="w-full h-2.5 rounded-full bg-slate-900 border border-slate-800 overflow-hidden">
                    <div 
                      className="h-full bg-gradient-to-r from-brand-600 via-indigo-600 to-cyan-400 rounded-full transition-all duration-300"
                      style={{ width: `${((indiceActual + 1) / situaciones.length) * 100}%` }}
                    />
                  </div>
                </div>

                <div className="glass-panel p-6 sm:p-8 rounded-3xl border border-slate-800">
                  <h2 className="text-xl sm:text-2xl font-black text-white tracking-tight mb-4">
                    {situacionActual.titulo}
                  </h2>
                  <div className="p-4 sm:p-5 rounded-2xl bg-slate-900/80 border border-slate-800 text-slate-200 text-sm leading-relaxed mb-6">
                    {situacionActual.descripcion}
                  </div>

                  <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">
                    ¿Cómo actuarías ante esta situación?
                  </div>

                  <div className="space-y-3">
                    {situacionActual.opciones.map((opc, idx) => {
                      const sel = opcionSeleccionada === idx;
                      return (
                        <div
                          key={idx}
                          onClick={() => setOpcionSeleccionada(idx)}
                          className={`p-4 rounded-2xl border cursor-pointer transition-all flex items-start space-x-3.5 ${
                            sel
                              ? 'bg-brand-600/20 border-brand-500 shadow-lg shadow-brand-500/10'
                              : 'bg-slate-900/50 border-slate-800 hover:border-slate-700'
                          }`}
                        >
                          <div className={`w-5 h-5 rounded-full border mt-0.5 flex items-center justify-center text-xs flex-shrink-0 ${
                            sel ? 'border-brand-400 bg-brand-500 text-white font-bold' : 'border-slate-600'
                          }`}>
                            {sel && '✓'}
                          </div>
                          <span className={`text-sm ${sel ? 'text-white font-medium' : 'text-slate-300'}`}>
                            {opc.texto}
                          </span>
                        </div>
                      );
                    })}
                  </div>

                  {alertaEvaluacion && (
                    <div className="mt-4 p-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs">
                      {alertaEvaluacion}
                    </div>
                  )}

                  <div className="mt-8 pt-6 border-t border-slate-800 flex items-center justify-between">
                    <div>
                      {indiceActual > 0 ? (
                        <button
                          type="button"
                          onClick={handleAtrasSituacion}
                          className="py-2.5 px-4 rounded-xl border border-slate-700 text-slate-300 hover:text-white text-xs font-bold transition-all"
                        >
                          ← Anterior
                        </button>
                      ) : (
                        <button
                          type="button"
                          onClick={() => setVista('dashboard')}
                          className="py-2.5 px-4 rounded-xl text-slate-400 hover:text-slate-200 text-xs font-semibold"
                        >
                          Cancelar
                        </button>
                      )}
                    </div>

                    <button
                      type="button"
                      disabled={evaluando}
                      onClick={handleSiguienteSituacion}
                      className="py-3 px-6 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 text-white font-bold text-sm shadow-lg shadow-brand-500/25 transition-all"
                    >
                      {evaluando
                        ? 'Procesando Evaluación...'
                        : indiceActual === situaciones.length - 1
                        ? '✨ Finalizar y Evaluar'
                        : 'Siguiente →'}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* 4. RESULTADOS */}
            {usuario && vista === 'resultados' && resultadoData && (
              <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8 animate-fade-in">
                <div className="glass-panel p-6 sm:p-8 rounded-3xl border border-brand-500/20 relative overflow-hidden">
                  <div className="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
                    <div className="md:col-span-5 flex flex-col items-center justify-center p-4">
                      <ScoreGauge percentage={resultadoData.puntuacion_general || 0} size={190} strokeWidth={15} />
                    </div>
                    <div className="md:col-span-7 space-y-4 text-center md:text-left">
                      <div className="inline-flex items-center space-x-1.5 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-semibold">
                        <span>✨ ¡Evaluación Completada con Éxito!</span>
                      </div>
                      <h1 className="text-3xl sm:text-4xl font-black text-white tracking-tight">
                        Tu Perfil DECIDE de Inteligencia Emocional
                      </h1>
                      <div className="p-3.5 rounded-2xl bg-slate-900/80 border border-slate-800 flex items-center justify-between text-xs">
                        <span>🎯 Ganaste <strong>+100 puntos</strong> por esta evaluación</span>
                        <span className="font-bold text-amber-400">Total: {resultadoData.gamificacion?.puntos || 0} pts</span>
                      </div>
                      <div className="pt-2 flex flex-wrap gap-3 justify-center md:justify-start">
                        <button
                          onClick={() => setVista('recomendaciones')}
                          className="py-3 px-5 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 text-white font-bold text-xs shadow-lg shadow-brand-500/25 transition-all"
                        >
                          💡 Ver Recomendaciones y Plan de Acción →
                        </button>
                        <button
                          onClick={() => setVista('dashboard')}
                          className="py-3 px-4 rounded-xl border border-slate-700 text-slate-300 hover:text-white text-xs font-semibold"
                        >
                          Volver al Inicio
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                <div>
                  <h2 className="text-xl font-bold text-white mb-4">Desglose por Competencia</h2>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {Object.entries(resultadoData.resultados || {}).map(([key, comp]) => (
                      <div key={key} className="glass-card p-5 rounded-2xl border border-slate-800 flex flex-col justify-between">
                        <div>
                          <div className="flex justify-between items-start mb-2">
                            <h3 className="text-sm font-bold text-white">{comp.nombre}</h3>
                            <span className="text-sm font-black text-brand-400">{comp.puntuacion_normalizada}%</span>
                          </div>
                          <p className="text-[11px] text-slate-400 mb-3">{comp.descripcion}</p>
                        </div>
                        <div>
                          <div className="w-full h-2 rounded-full bg-slate-800 overflow-hidden mb-2">
                            <div 
                              className="h-full rounded-full bg-gradient-to-r from-brand-500 to-cyan-400"
                              style={{ width: `${comp.puntuacion_normalizada}%` }}
                            />
                          </div>
                          <div className="flex justify-between items-center text-[10px]">
                            <span className="font-semibold text-slate-300">{comp.nivel?.nivel}</span>
                            <span className="text-slate-500">{comp.puntuacion_total} pts</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* 5. RECOMENDACIONES */}
            {usuario && vista === 'recomendaciones' && resultadoData && (
              <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8 animate-fade-in">
                <button
                  onClick={() => setVista('resultados')}
                  className="text-xs font-semibold text-slate-400 hover:text-white"
                >
                  ← Volver a Resultados
                </button>
                <h1 className="text-3xl font-black text-white">💡 Plan de Desarrollo y Consejos</h1>

                {resultadoData.plan_desarrollo && (
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {resultadoData.plan_desarrollo.enfoque_principal && (
                      <div className="glass-card p-5 rounded-2xl border border-rose-500/30 bg-rose-500/5">
                        <span className="text-xs font-bold text-rose-400 uppercase">Área Prioritaria</span>
                        <h3 className="text-base font-extrabold text-white mt-1">
                          {resultadoData.plan_desarrollo.enfoque_principal[1]?.nombre}
                        </h3>
                        <div className="text-2xl font-black text-rose-400 my-1">
                          {resultadoData.plan_desarrollo.enfoque_principal[1]?.puntuacion_normalizada}%
                        </div>
                        <p className="text-xs text-slate-400">Mayor oportunidad de crecimiento inmediato.</p>
                      </div>
                    )}
                    <div className="glass-card p-5 rounded-2xl border border-amber-500/30 bg-amber-500/5">
                      <span className="text-xs font-bold text-amber-400 uppercase">En Desarrollo</span>
                      <div className="space-y-1.5 mt-2">
                        {resultadoData.plan_desarrollo.secundarios?.map(([k, v], i) => (
                          <div key={i} className="flex justify-between text-xs">
                            <span className="text-white">{v.nombre}</span>
                            <span className="font-bold text-amber-400">{v.puntuacion_normalizada}%</span>
                          </div>
                        ))}
                      </div>
                    </div>
                    <div className="glass-card p-5 rounded-2xl border border-emerald-500/30 bg-emerald-500/5">
                      <span className="text-xs font-bold text-emerald-400 uppercase">Fortalezas Clave</span>
                      <div className="space-y-1.5 mt-2">
                        {resultadoData.plan_desarrollo.fortalezas?.map(([k, v], i) => (
                          <div key={i} className="flex justify-between text-xs">
                            <span className="text-white">{v.nombre}</span>
                            <span className="font-bold text-emerald-400">{v.puntuacion_normalizada}%</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                <div className="space-y-3">
                  <h2 className="text-lg font-bold text-white">Próximos Pasos Sugeridos</h2>
                  {resultadoData.proximos_pasos?.map((paso, idx) => (
                    <div key={idx} className="p-4 rounded-2xl bg-slate-900/60 border border-slate-800 flex justify-between items-center text-xs">
                      <div>
                        <span className={`px-2 py-0.5 rounded font-bold mr-2 ${paso.prioridad === 'ALTA' ? 'bg-rose-500/20 text-rose-400' : 'bg-amber-500/20 text-amber-400'}`}>
                          {paso.prioridad}
                        </span>
                        <span className="font-bold text-white">{paso.competencia}:</span> {paso.accion}
                      </div>
                      <span className="font-bold text-cyan-300 ml-4 whitespace-nowrap">{paso.meta}</span>
                    </div>
                  ))}
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {Object.entries(resultadoData.recomendaciones || {}).map(([k, rec]) => (
                    <div key={k} className="glass-card p-5 rounded-2xl border border-slate-800">
                      <div className="flex justify-between items-center mb-2">
                        <h4 className="text-sm font-bold text-white">{rec.nombre}</h4>
                        <span className="text-xs text-brand-400 font-bold">{rec.puntuacion}%</span>
                      </div>
                      <p className="text-xs text-slate-300">{rec.recomendacion}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 6. LOGROS */}
            {usuario && vista === 'logros' && (
              <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8 animate-fade-in">
                <div className="glass-panel p-6 sm:p-8 rounded-3xl border border-amber-500/20">
                  <h1 className="text-3xl font-black text-white mb-2">🏆 Vitrina de Logros DECIDE</h1>
                  <p className="text-sm text-slate-400">
                    Desbloqueados: <strong>{datosLogros?.total_desbloqueados || 0} de {datosLogros?.logros?.length || 12}</strong>
                  </p>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                  {datosLogros?.logros?.map(item => (
                    <div key={item.tipo} className={`p-5 rounded-2xl border ${item.desbloqueado ? 'glass-card border-amber-500/40 bg-amber-500/5' : 'bg-slate-900/30 border-slate-800/60 opacity-60'}`}>
                      <div className="flex justify-between items-start mb-2">
                        <span className="text-3xl">{item.desbloqueado ? item.icono : '🔒'}</span>
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${item.desbloqueado ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-slate-400'}`}>
                          {item.desbloqueado ? 'Desbloqueado' : 'Bloqueado'}
                        </span>
                      </div>
                      <h4 className="text-sm font-bold text-white mt-1">{item.nombre}</h4>
                      <p className="text-xs text-slate-400 mt-1">{item.descripcion}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 7. HISTORIAL */}
            {usuario && vista === 'historial' && (
              <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8 animate-fade-in">
                <div className="flex justify-between items-center">
                  <h1 className="text-3xl font-black text-white">📜 Historial de Evaluaciones</h1>
                  <button onClick={iniciarTest} className="py-2.5 px-4 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs">
                    + Nueva Evaluación
                  </button>
                </div>
                {historial.length === 0 ? (
                  <div className="glass-panel p-12 rounded-3xl border border-slate-800 text-center">
                    <p className="text-sm text-slate-400">Aún no has completado evaluaciones.</p>
                  </div>
                ) : (
                  <div className="space-y-4">
                    {historial.map((item, idx) => (
                      <div key={idx} className="glass-card p-5 rounded-2xl border border-slate-800 flex justify-between items-center">
                        <div>
                          <div className="text-xs text-slate-400">{item.fecha}</div>
                          <h4 className="text-base font-bold text-white mt-0.5">Evaluación #{historial.length - idx}</h4>
                        </div>
                        <div className="text-right">
                          <span className="text-2xl font-black text-brand-400">{item.puntuacion_general}%</span>
                          <div className="text-[10px] text-slate-400">Puntaje General</div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

          </main>

          {/* Modal de Nuevos Logros */}
          {nuevosLogros.length > 0 && (
            <AchievementModal logros={nuevosLogros} onClose={() => setNuevosLogros([])} />
          )}

          <footer className="py-6 border-t border-slate-900 text-center text-xs text-slate-500">
            DECIDE v2.0 Web Edition • React + Tailwind CSS + Bootstrap
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
